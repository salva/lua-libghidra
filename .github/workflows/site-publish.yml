# Preparing this file grants no permission to dispatch, enable Pages or publish.
name: Publish checked site
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare explicit converter and prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 cmake
          sh site/prepare-toolchain.sh "$RUNNER_TEMP/pandoc"
      - name: Offline build and qualification
        run: |
          PANDOC="$RUNNER_TEMP/pandoc/pandoc-3.6.4/bin/pandoc"
          lua5.4 scripts/build-site.lua --pandoc "$PANDOC" --baseurl /lua-libghidra --origin https://salva.github.io --output "$RUNNER_TEMP/site" --report "$RUNNER_TEMP/site.json"
          lua5.4 scripts/check-site.lua --root "$RUNNER_TEMP/site" --baseurl /lua-libghidra --report "$RUNNER_TEMP/site.json" --source .
          lua5.4 tests/site_contract.lua --work "$RUNNER_TEMP/probes" --pandoc "$PANDOC"
      # Equivalent Pages archive packaging avoids upload-pages-artifact's floating
      # transitive actions/upload-artifact@v4. Membership/symlinks checked above.
      - name: Package only checked output
        run: tar --directory "$RUNNER_TEMP/site" -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
      # No Pages configuration/enablement action.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
